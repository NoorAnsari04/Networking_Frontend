plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.awesomeapp"

    // Define these manually instead of using `flutter.<property>`
    compileSdk = 34
    ndkVersion = "23.1.7779620"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.awesomeapp"

        // Define these manually instead of using `flutter.<property>`
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so flutter run --release works.
            signingConfig = signingConfigs.debug
        }
    }

    flavorDimensions "env"
    productFlavors {
        production {
            dimension "env"
            resValue "string", "app_name", "Networking App"
            applicationIdSuffix ""
        }
        staging {
            dimension "env"
            resValue "string", "app_name", "Networking Staging"
            applicationIdSuffix ".stg"
        }
    }
}

flutter {
    source = "../.."
}
